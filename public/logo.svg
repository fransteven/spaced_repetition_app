<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#1b1446" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3525cd" />
    </linearGradient>

    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="emeraldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <rect x="146" y="110" width="220" height="270" rx="24" transform="rotate(-12 256 245)" fill="url(#cardBack)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="146" y="110" width="220" height="270" rx="24" transform="rotate(-4 256 245)" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <g filter="url(#dropShadow)">
    <rect x="136" y="126" width="240" height="280" rx="28" fill="url(#cardFront)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
  </g>

  <path d="M 186 296 C 186 216, 276 216, 276 266 C 276 316, 326 316, 326 236" fill="none" stroke="url(#synapseGlow)" stroke-width="12" stroke-linecap="round" />

  <circle cx="186" cy="296" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="276" cy="266" r="10" fill="#818cf8" stroke="#ffffff" stroke-width="3" />
  <circle cx="326" cy="236" r="16" fill="url(#emeraldGlow)" filter="url(#emeraldShadow)" stroke="#ffffff" stroke-width="4" />

  <path d="M 326 206 L 326 266 M 296 236 L 356 236" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>
